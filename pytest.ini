[pytest]
pythonpath = .
testpaths = tests

# --strict-markers turns a typo'd @pytest.mark.integraton into an error instead
# of a silently-ignored marker. --strict-config does the same for this file.
# -ra prints a summary of everything that was not a plain pass.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    integration: exercises a real Redis server; skipped when none is reachable
